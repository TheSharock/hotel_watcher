name: Venetian rate watch

on:
  schedule:
    # Once a day at 15:00 UTC (~7-8 AM Pacific). Times are UTC — adjust as you like.
    # cron is minute hour day month weekday.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

# Allow the job to commit the refreshed rates.json back to the repo.
permissions:
  contents: write

# If a run is still going when the next fires, don't stack them.
concurrency:
  group: rate-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run the rate check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python venetian_watch.py

      - name: Commit refreshed rates.json
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/rates.json
          if git diff --staged --quiet; then
            echo "No rate change — nothing to commit."
          else
            git commit -m "Update rates $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
